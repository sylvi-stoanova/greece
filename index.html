    ['parallel-writing','Две изречения за миналото','Напиши едно изречение на гръцки с ενώ за две успоредни действия и едно с την ώρα που за събитие, настъпило по време на друго действие.','Провери дали и двете успоредни действия са в παρατατικός. Във второто изречение използвай παρατατικός за фона и аорист за събитието.','Ενώ η Ίριδα διάβαζε, ο Νίκος μαγείρευε. Την ώρα που πλέναμε τα πιάτα, χτύπησε το τηλέφωνο.','Докато Ирида четеше, Никос готвеше. Докато миехме чиниите, телефонът звънна.'],
    ['cinema-writing','Разговор след кино','Напиши кратък диалог за филм. Попитай какъв жанр е и какво се е харесало на събеседника. Добави какво се е харесало или не се е харесало на друг зрител.','Провери дали άρεσε или άρεσαν се съгласува с това, което се е харесало. Назови жанра и поне една конкретна причина за мнението.','— Τι είδες χθες; — Μια κωμωδία. — Τι σου άρεσε; — Μου άρεσαν οι διάλογοι, γιατί ήταν αστείοι. Στη Λένα δεν άρεσε το τέλος.','— Какво гледа вчера? — Комедия. — Какво ти хареса? — Харесаха ми диалозите, защото бяха смешни. На Лена не ѝ хареса краят.']
  ];

}
